<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Miner helmet -->
  <path d="M16 38 q0 -16 16 -16 q16 0 16 16 z" fill="url(#gold)"/>
  <rect x="14" y="37" width="36" height="6" rx="3" fill="#B45309"/>
  <!-- Lamp -->
  <circle cx="32" cy="22" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="32" cy="22" r="2.4" fill="#FDE68A"/>
  <!-- Pickaxe -->
  <path d="M14 46 q18 -10 36 0" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <rect x="30" y="44" width="4" height="14" rx="2" fill="#94a3b8"/>
  <!-- Gem accent -->
  <path d="M44 50 l4 -6 l4 6 l-4 6 z" fill="url(#gem)"/>
</svg>
